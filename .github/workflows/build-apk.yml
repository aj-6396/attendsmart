name: Build Android APK

on:
  push:
    branches:
      - main
      - capacitor-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Signing Keystore
        run: |
          if [ ! -f android/app/release.jks ]; then
            keytool -genkeypair -v -keystore android/app/release.jks -alias classmark -keyalg RSA -keysize 2048 -validity 10000 -storepass classmark123 -keypass classmark123 -dname "CN=ClassMark, OU=ClassMark, O=ClassMark, L=Delhi, ST=Delhi, C=IN"
          fi

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassMark-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

